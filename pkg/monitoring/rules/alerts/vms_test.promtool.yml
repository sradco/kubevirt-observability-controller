rule_files:
  - rules.yaml

group_eval_order:
  - recordingRules.rules
  - alerts.rules

evaluation_interval: 1m

tests:
  - name: OutdatedGuestDeviceDrivers fires after one hour
    interval: 1m
    input_series:
      - series: 'kubevirt_vmi_guest_device_driver_timestamp_seconds{namespace="default",name="vm-old",device_id="1041",driver_name="netkvm",driver_version="100.85.104.16700",guest_os_version_id="2022"}'
        values: '1700000000x70'
      - series: 'kubevirt_vmi_guest_device_driver_timestamp_seconds{name="vm-no-namespace",device_id="1041",driver_name="netkvm",driver_version="100.85.104.16700",guest_os_version_id="2022"}'
        values: '1700000000x70'
      - series: 'kubevirt_guest_device_driver_latest_version_info{device_id="1041",driver_version="100.95.104.26200",guest_os_version_id="2022"}'
        values: '1x70'
    alert_rule_test:
      - alertname: OutdatedGuestDeviceDrivers
        eval_time: 59m
        exp_alerts: []
      - alertname: OutdatedGuestDeviceDrivers
        eval_time: 61m
        exp_alerts:
          - exp_labels:
              namespace: default
              name: vm-old
              vm: vm-old
              device_id: "1041"
              driver_name: netkvm
              driver_version: "100.85.104.16700"
              guest_os_version_id: "2022"
              severity: warning
              operator_health_impact: none
              kubernetes_operator_part_of: kubevirt
              kubernetes_operator_component: kubevirt
            exp_annotations:
              summary: "A guest device driver is outdated: its installed version is not the latest known version for that device and guest OS version."
              description: "VirtualMachine vm-old in namespace default is running driver netkvm version 100.85.104.16700, which is outdated for guest OS version 2022."
              runbook_url: "https://kubevirt.io/monitoring/runbooks/OutdatedGuestDeviceDrivers"

  - name: with no drivers config the alert cannot fire
    interval: 1m
    input_series:
      - series: 'kubevirt_vmi_guest_device_driver_timestamp_seconds{namespace="default",name="vm-old",device_id="1041",driver_name="netkvm",driver_version="100.85.104.16700",guest_os_version_id="2022"}'
        values: '1700000000x70'
    alert_rule_test:
      - alertname: OutdatedGuestDeviceDrivers
        eval_time: 70m
        exp_alerts: []

  - name: KubeVirtVMIOrdinalPodInterfaceName fires for a running VMI with an ordinal interface
    interval: 1m
    input_series:
      # Primary pod interface is always eth0; the ordinal secondary is net1.
      - series: 'kubevirt_vmi_vnic_info{namespace="default",name="vm-ordinal",vnic_name="default",pod_interface_name="eth0"}'
        values: '1x10'
      - series: 'kubevirt_vmi_vnic_info{namespace="default",name="vm-ordinal",vnic_name="secondary",pod_interface_name="net1"}'
        values: '1x10'
      - series: 'kubevirt_vmi_info{namespace="default",name="vm-ordinal",phase="running"}'
        values: '1x10'
    alert_rule_test:
      - alertname: KubeVirtVMIOrdinalPodInterfaceName
        eval_time: 4m
        exp_alerts: []
      - alertname: KubeVirtVMIOrdinalPodInterfaceName
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              namespace: default
              name: vm-ordinal
              vm: vm-ordinal
              severity: warning
              operator_health_impact: none
              kubernetes_operator_part_of: kubevirt
              kubernetes_operator_component: kubevirt
            exp_annotations:
              summary: "A VirtualMachineInstance uses the deprecated ordinal pod network interface naming scheme."
              description: "VirtualMachineInstance vm-ordinal in namespace default uses the deprecated ordinal pod network interface naming scheme. Live-migrate it once, or stop and start it, to adopt the new naming scheme."
              runbook_url: "https://kubevirt.io/monitoring/runbooks/KubeVirtVMIOrdinalPodInterfaceName"

  - name: KubeVirtVMIOrdinalPodInterfaceName does not fire for non-ordinal or non-running VMIs
    interval: 1m
    input_series:
      # Running VMI with an eth0 primary and a hashed (new scheme) secondary.
      - series: 'kubevirt_vmi_vnic_info{namespace="default",name="vm-hashed",vnic_name="default",pod_interface_name="eth0"}'
        values: '1x10'
      - series: 'kubevirt_vmi_vnic_info{namespace="default",name="vm-hashed",vnic_name="secondary",pod_interface_name="pod16477688c0e"}'
        values: '1x10'
      - series: 'kubevirt_vmi_info{namespace="default",name="vm-hashed",phase="running"}'
        values: '1x10'
      # Ordinal secondary, but the VMI is not running.
      - series: 'kubevirt_vmi_vnic_info{namespace="default",name="vm-stopped",vnic_name="default",pod_interface_name="eth0"}'
        values: '1x10'
      - series: 'kubevirt_vmi_vnic_info{namespace="default",name="vm-stopped",vnic_name="secondary",pod_interface_name="net1"}'
        values: '1x10'
      - series: 'kubevirt_vmi_info{namespace="default",name="vm-stopped",phase="succeeded"}'
        values: '1x10'
    alert_rule_test:
      - alertname: KubeVirtVMIOrdinalPodInterfaceName
  # ---------------------------------------------------------------------------
  # Test cases ported from kubevirt hack/prom-rule-ci/prom-rules-tests.yaml
  # (kept in sync with pkg/monitoring/rules/alerts/vms.go).
  # ---------------------------------------------------------------------------

  - interval: 1m
    input_series:
    - series: kubevirt_vmi_info{phase="running", node="node1", namespace="ns-test", name="vm-evict-nonmigratable"}
      values: 0 0 0 0 1 1 1 1
    - series: kubevirt_vmi_non_evictable{node="node1", namespace="ns-test", name="vm-evict-nonmigratable"}
      values: 1 1 1 1 1 1 1 1
    alert_rule_test:
    - eval_time: 1m
      alertname: VMCannotBeEvicted
      exp_alerts: []
    - eval_time: 5m
      alertname: VMCannotBeEvicted
      exp_alerts:
      - exp_annotations:
          description: Eviction policy for VirtualMachine vm-evict-nonmigratable in namespace ns-test (on
            node node1) is set to Live Migration but the VM is not migratable
          summary: The VM's eviction strategy is set to Live Migration but the VM is not migratable
          runbook_url: https://kubevirt.io/monitoring/runbooks/VMCannotBeEvicted
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          name: vm-evict-nonmigratable
          vm: vm-evict-nonmigratable
          namespace: ns-test
          node: node1

  - interval: 1m
    input_series:
    - series: kubevirt_vmi_info{phase="running", node="node1", namespace="ns-test", name="vm-evict-migratable"}
      values: 1 1 1 1 1 1 1 1
    - series: kubevirt_vmi_non_evictable{node="node1", namespace="ns-test", name="vm-evict-migratable"}
      values: '0 0 0 0 0 0 0 0 '
    alert_rule_test:
    - eval_time: 1m
      alertname: VMCannotBeEvicted
      exp_alerts: []

  - interval: 1h
    input_series:
    - series: kubevirt_vmi_migration_succeeded{vmi="vmi-example-1", namespace="namespace-example-1"}
      values: _ _ _ 1 7 13
    alert_rule_test:
    - eval_time: 4h
      alertname: KubeVirtVMIExcessiveMigrations
      exp_alerts: []
    - eval_time: 5h
      alertname: KubeVirtVMIExcessiveMigrations
      exp_alerts:
      - exp_annotations:
          description: VirtualMachineInstance vmi-example-1 in namespace namespace-example-1 has been migrated
            more than 12 times during the last 24 hours
          summary: An excessive amount of migrations have been detected on a VirtualMachineInstance in the
            last 24 hours.
          runbook_url: https://kubevirt.io/monitoring/runbooks/KubeVirtVMIExcessiveMigrations
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          vmi: vmi-example-1
          vm: vmi-example-1
          namespace: namespace-example-1
    - eval_time: 24h
      alertname: KubeVirtVMIExcessiveMigrations
      exp_alerts:
      - exp_annotations:
          description: VirtualMachineInstance vmi-example-1 in namespace namespace-example-1 has been migrated
            more than 12 times during the last 24 hours
          summary: An excessive amount of migrations have been detected on a VirtualMachineInstance in the
            last 24 hours.
          runbook_url: https://kubevirt.io/monitoring/runbooks/KubeVirtVMIExcessiveMigrations
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          vmi: vmi-example-1
          vm: vmi-example-1
          namespace: namespace-example-1
    - eval_time: 30h
      alertname: KubeVirtVMIExcessiveMigrations
      exp_alerts: []

  - interval: 1h
    input_series:
    - series: kubevirt_vmi_migration_succeeded{vmi="vmi-example-1", namespace="namespace-example-1"}
      values: _ 1 2 3 8 10 10
    - series: kubevirt_vmi_migration_succeeded{vmi="vmi-example-1", namespace="namespace-example-1", vmim="same-migration",
        pod="virt-controller-1"}
      values: _ _ _ 1 1 1 2
    - series: kubevirt_vmi_migration_succeeded{vmi="vmi-example-1", namespace="namespace-example-1", vmim="same-migration",
        pod="virt-controller-2"}
      values: _ _ _ 1 1 1 2
    alert_rule_test:
    - eval_time: 5h
      alertname: KubeVirtVMIExcessiveMigrations
      exp_alerts: []
    - eval_time: 6h
      alertname: KubeVirtVMIExcessiveMigrations
      exp_alerts:
      - exp_annotations:
          description: VirtualMachineInstance vmi-example-1 in namespace namespace-example-1 has been migrated
            more than 12 times during the last 24 hours
          summary: An excessive amount of migrations have been detected on a VirtualMachineInstance in the
            last 24 hours.
          runbook_url: https://kubevirt.io/monitoring/runbooks/KubeVirtVMIExcessiveMigrations
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          vmi: vmi-example-1
          vm: vmi-example-1
          namespace: namespace-example-1

  - interval: 1m
    input_series:
    - series: kubevirt_vmi_guest_load_1m{namespace="testns",name="vm1"}
      values: 0  12  25  5
    - series: kubevirt_vmi_vcpu_seconds_total{namespace="testns",name="vm1",id="0"}
      values: 0  0   0   0
    - series: kubevirt_vmi_vcpu_seconds_total{namespace="testns",name="vm1",id="1"}
      values: 0  0   0   0
    alert_rule_test:
    - eval_time: 1m
      alertname: GuestVCPUQueueHighWarning
      exp_alerts: []
    - eval_time: 1m
      alertname: GuestVCPUQueueHighCritical
      exp_alerts: []
    - eval_time: 2m
      alertname: GuestVCPUQueueHighWarning
      exp_alerts:
      - exp_annotations:
          description: VirtualMachineInstance vm1 CPU queue length > 10
          summary: Guest vCPU Queue within collection cycle > 10
          runbook_url: https://kubevirt.io/monitoring/runbooks/GuestVCPUQueueHighWarning
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          namespace: testns
          name: vm1
          vm: vm1
    - eval_time: 2m
      alertname: GuestVCPUQueueHighCritical
      exp_alerts:
      - exp_annotations:
          description: VirtualMachineInstance vm1 CPU queue length > 20
          summary: Guest vCPU Queue within collection cycle > 20
          runbook_url: https://kubevirt.io/monitoring/runbooks/GuestVCPUQueueHighCritical
        exp_labels:
          severity: critical
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          namespace: testns
          name: vm1
          vm: vm1
    - eval_time: 3m
      alertname: GuestVCPUQueueHighWarning
      exp_alerts: []
    - eval_time: 3m
      alertname: GuestVCPUQueueHighCritical
      exp_alerts: []

  - interval: 1m
    input_series:
    - series: kubevirt_vm_info{name="vm-stuck-provisioning", namespace="test-ns", status="provisioning",
        status_group="starting"}
      values: 1x16
    - series: kubevirt_vm_info{name="vm-stuck-starting-no-vmi", namespace="test-ns", status="starting",
        status_group="starting"}
      values: 1x16
    - series: kubevirt_vm_info{name="vm-unschedulable", namespace="test-ns", status="ErrorUnschedulable",
        status_group="error"}
      values: 1x16
    - series: kubevirt_vm_info{name="vm-pvc-missing", namespace="test-ns", status="ErrorPvcNotFound", status_group="error"}
      values: 1x16
    - series: kubevirt_vm_info{name="vm-terminating-no-vmi", namespace="test-ns", status="terminating",
        status_group="non_running"}
      values: 1x16
    - series: kubevirt_vm_info{name="vm-stopped", namespace="test-ns", status="stopped", status_group="non_running"}
      values: 1x16
    alert_rule_test:
    - eval_time: 9m
      alertname: VirtualMachineStuckInUnhealthyState
      exp_alerts: []
    - eval_time: 10m
      alertname: VirtualMachineStuckInUnhealthyState
      exp_alerts:
      - exp_annotations:
          summary: Virtual machine in provisioning state for more than 10 minutes
          description: Virtual machine vm-stuck-provisioning in namespace test-ns has been in provisioning
            state for more than 10 minutes.
          runbook_url: https://kubevirt.io/monitoring/runbooks/VirtualMachineStuckInUnhealthyState
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          name: vm-stuck-provisioning
          vm: vm-stuck-provisioning
          namespace: test-ns
          status: provisioning
      - exp_annotations:
          summary: Virtual machine in starting state for more than 10 minutes
          description: Virtual machine vm-stuck-starting-no-vmi in namespace test-ns has been in starting
            state for more than 10 minutes.
          runbook_url: https://kubevirt.io/monitoring/runbooks/VirtualMachineStuckInUnhealthyState
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          name: vm-stuck-starting-no-vmi
          vm: vm-stuck-starting-no-vmi
          namespace: test-ns
          status: starting
      - exp_annotations:
          summary: Virtual machine in ErrorUnschedulable state for more than 10 minutes
          description: Virtual machine vm-unschedulable in namespace test-ns has been in ErrorUnschedulable
            state for more than 10 minutes.
          runbook_url: https://kubevirt.io/monitoring/runbooks/VirtualMachineStuckInUnhealthyState
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          name: vm-unschedulable
          vm: vm-unschedulable
          namespace: test-ns
          status: ErrorUnschedulable
      - exp_annotations:
          summary: Virtual machine in ErrorPvcNotFound state for more than 10 minutes
          description: Virtual machine vm-pvc-missing in namespace test-ns has been in ErrorPvcNotFound
            state for more than 10 minutes.
          runbook_url: https://kubevirt.io/monitoring/runbooks/VirtualMachineStuckInUnhealthyState
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          name: vm-pvc-missing
          vm: vm-pvc-missing
          namespace: test-ns
          status: ErrorPvcNotFound
      - exp_annotations:
          summary: Virtual machine in terminating state for more than 10 minutes
          description: Virtual machine vm-terminating-no-vmi in namespace test-ns has been in terminating
            state for more than 10 minutes.
          runbook_url: https://kubevirt.io/monitoring/runbooks/VirtualMachineStuckInUnhealthyState
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          name: vm-terminating-no-vmi
          vm: vm-terminating-no-vmi
          namespace: test-ns
          status: terminating

  - interval: 1m
    input_series:
    - series: kubevirt_vm_info{name="vm-stuck-starting", namespace="test-ns", status="starting", status_group="starting"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-stuck-starting", namespace="test-ns", node="worker-node-1", phase="running"}
      values: 1x11
    - series: kubevirt_vm_info{name="vm-image-error", namespace="test-ns", status="ErrImagePull", status_group="error"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-image-error", namespace="test-ns", node="worker-node-2", phase="running"}
      values: 1x11
    - series: kubevirt_vm_info{name="vm-stuck-stopping", namespace="test-ns", status="stopping", status_group="non_running"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-stuck-stopping", namespace="test-ns", node="worker-node-3", phase="running"}
      values: 1x11
    - series: kubevirt_vm_info{name="vm-terminating-with-vmi", namespace="test-ns", status="terminating",
        status_group="non_running"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-terminating-with-vmi", namespace="test-ns", node="worker-node-4",
        phase="scheduled"}
      values: 1x11
    - series: kubevirt_vm_info{name="vm-running", namespace="test-ns", status="running", status_group="running"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-running", namespace="test-ns", node="worker-node-5", phase="running"}
      values: 1x11
    - series: kubevirt_vm_info{name="vm-paused", namespace="test-ns", status="paused", status_group="running"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-paused", namespace="test-ns", node="worker-node-6", phase="scheduled"}
      values: 1x11
    - series: kubevirt_vm_info{name="vm-starting-no-vmi", namespace="test-ns", status="starting", status_group="starting"}
      values: 1x11
    - series: kubevirt_vm_info{name="vm-starting-pending-vmi", namespace="test-ns", status="starting", status_group="starting"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-starting-pending-vmi", namespace="test-ns", node="worker-node-11",
        phase="pending"}
      values: 1x11
    - series: kubevirt_vm_info{name="vm-error-failed-vmi", namespace="test-ns", status="CrashLoopBackOff",
        status_group="error"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-error-failed-vmi", namespace="test-ns", node="worker-node-12",
        phase="failed"}
      values: 1x11
    alert_rule_test:
    - eval_time: 4m
      alertname: VirtualMachineStuckOnNode
      exp_alerts: []
    - eval_time: 5m
      alertname: VirtualMachineStuckOnNode
      exp_alerts:
      - exp_annotations:
          summary: Virtual machine stuck in unhealthy state for more than 5 minutes
          description: Virtual machine vm-stuck-starting in namespace test-ns on node worker-node-1 has
            been in starting state for more than 5 minutes. This may indicate issues with the VM lifecycle
            on the target node.
          runbook_url: https://kubevirt.io/monitoring/runbooks/VirtualMachineStuckOnNode
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          name: vm-stuck-starting
          vm: vm-stuck-starting
          namespace: test-ns
          status: starting
          node: worker-node-1
      - exp_annotations:
          summary: Virtual machine stuck in unhealthy state for more than 5 minutes
          description: Virtual machine vm-image-error in namespace test-ns on node worker-node-2 has been
            in ErrImagePull state for more than 5 minutes. This may indicate issues with the VM lifecycle
            on the target node.
          runbook_url: https://kubevirt.io/monitoring/runbooks/VirtualMachineStuckOnNode
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          name: vm-image-error
          vm: vm-image-error
          namespace: test-ns
          status: ErrImagePull
          node: worker-node-2
      - exp_annotations:
          summary: Virtual machine stuck in unhealthy state for more than 5 minutes
          description: Virtual machine vm-stuck-stopping in namespace test-ns on node worker-node-3 has
            been in stopping state for more than 5 minutes. This may indicate issues with the VM lifecycle
            on the target node.
          runbook_url: https://kubevirt.io/monitoring/runbooks/VirtualMachineStuckOnNode
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          name: vm-stuck-stopping
          vm: vm-stuck-stopping
          namespace: test-ns
          status: stopping
          node: worker-node-3
      - exp_annotations:
          summary: Virtual machine stuck in unhealthy state for more than 5 minutes
          description: Virtual machine vm-terminating-with-vmi in namespace test-ns on node worker-node-4
            has been in terminating state for more than 5 minutes. This may indicate issues with the VM
            lifecycle on the target node.
          runbook_url: https://kubevirt.io/monitoring/runbooks/VirtualMachineStuckOnNode
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          name: vm-terminating-with-vmi
          vm: vm-terminating-with-vmi
          namespace: test-ns
          status: terminating
          node: worker-node-4

  - interval: 1m
    input_series:
    - series: kubevirt_vm_info{name="vm-phase-overlap", namespace="test-ns", status="starting", status_group="starting"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-phase-overlap", namespace="test-ns", phase="scheduling"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-phase-overlap", namespace="test-ns", phase="running", node="worker-node-7"}
      values: 1x11
    - series: kubevirt_vm_info{name="vm-stuck-scheduled", namespace="test-ns", status="starting", status_group="starting"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-stuck-scheduled", namespace="test-ns", phase="scheduled", node="worker-node-8"}
      values: 1x11
    - series: kubevirt_vm_info{name="vm-sched-run-overlap", namespace="test-ns", status="starting", status_group="starting"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-sched-run-overlap", namespace="test-ns", phase="scheduled", node="worker-node-9"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-sched-run-overlap", namespace="test-ns", phase="running", node="worker-node-10"}
      values: 2x11
    - series: kubevirt_vm_info{name="vm-migration-overlap", namespace="test-ns", status="stopping", status_group="non_running"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-migration-overlap", namespace="test-ns", phase="running", node="source-node"}
      values: 2x11
    - series: kubevirt_vmi_info{name="vm-migration-overlap", namespace="test-ns", phase="running", node="target-node"}
      values: 1x11
    - series: kubevirt_vm_info{name="vm-error-migration", namespace="test-ns", status="ErrImagePull", status_group="error"}
      values: 1x11
    - series: kubevirt_vmi_info{name="vm-error-migration", namespace="test-ns", phase="running", node="source-node-2"}
      values: 2x11
    - series: kubevirt_vmi_info{name="vm-error-migration", namespace="test-ns", phase="running", node="target-node-2"}
      values: 1x11
    alert_rule_test:
    - eval_time: 4m
      alertname: VirtualMachineStuckOnNode
      exp_alerts: []
    - eval_time: 5m
      alertname: VirtualMachineStuckOnNode
      exp_alerts:
      - exp_annotations:
          summary: Virtual machine stuck in unhealthy state for more than 5 minutes
          description: Virtual machine vm-phase-overlap in namespace test-ns on node worker-node-7 has been
            in starting state for more than 5 minutes. This may indicate issues with the VM lifecycle on
            the target node.
          runbook_url: https://kubevirt.io/monitoring/runbooks/VirtualMachineStuckOnNode
        exp_labels:
          severity: warning
          operator_health_impact: none
          kubernetes_operator_part_of: kubevirt
          kubernetes_operator_component: kubevirt
          name: vm-phase-overlap
          vm: vm-phase-overlap
          namespace: test-ns
          status: starting
